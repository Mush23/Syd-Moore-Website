name: Deploy to GitHub Pages

# Publishes the site on every push to main, and rebuilds it every morning so
# "Pre-order" becomes "Out now" on publication day and past events move into
# the archive. 05:00 UTC = 06:00 UK time in summer, 05:00 in winter.
# GitHub pauses scheduled runs after 60 days without commits; re-enable in the
# Actions tab if that happens.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # "/<repo>" on the github.io address, empty once a custom domain is set.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          PUBLIC_KIT_FORM_ACTION: ${{ vars.PUBLIC_KIT_FORM_ACTION }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_AMAZON_TAG: ${{ vars.PUBLIC_AMAZON_TAG }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
